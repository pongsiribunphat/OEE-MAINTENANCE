<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PROJECT PU - Keypad M3</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root[data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0b0f19 100%);
      --bg-card: rgba(17, 24, 39, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-hover: rgba(56, 189, 248, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-accent: #38bdf8;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --box-inner-bg: rgba(255, 255, 255, 0.03);
    }

    :root[data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
      --bg-card: rgba(255, 255, 255, 0.88);
      --border-color: rgba(0, 0, 0, 0.06);
      --border-color-hover: rgba(37, 99, 235, 0.3);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-accent: #0284c7;
      --shadow-color: rgba(15, 23, 42, 0.08);
      --box-inner-bg: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Kanit', sans-serif; transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease; }
    body { min-height: 100vh; background: var(--bg-gradient); color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; }
    .mobile-card { width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 28px; padding: 28px 22px; backdrop-filter: blur(20px); box-shadow: 0 20px 40px var(--shadow-color); position: relative; overflow: hidden; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-nav { background: var(--box-inner-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-nav:hover { border-color: var(--border-color-hover); }
    .header-info h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
    .header-info p { font-size: 0.8rem; color: var(--text-muted); }

     /* =========================================================
       🚨 HIGH-VISIBILITY & MOBILE-RESPONSIVE STATUS DISPLAY BOX
       ========================================================= */
    .status-display-box {
      background: var(--box-inner-bg);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 14px 16px; /* ปรับ Padding ให้กระชับขึ้นสำหรับจอมือถือ */
      margin: 18px 0 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px; /* เพิ่มช่องว่างป้องกันข้อความชนกัน */
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 25px var(--shadow-color);
    }

    .status-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .status-value-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #64748b;
      display: inline-block;
      flex-shrink: 0; /* ป้องกันจุดถูกบีบเบี้ยว */
      box-shadow: 0 0 8px currentColor;
      transition: all 0.3s ease;
    }

    #current-status {
      font-size: clamp(1.05rem, 4.2vw, 1.55rem); /* ย่อ-ขยายขนาดฟอนต์อัตโนมัติตามจอมือถือ */
      font-weight: 900;
      letter-spacing: 0.5px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      white-space: nowrap; /* ป้องกันข้อความตกบรรทัด */
      flex-shrink: 0; /* 🌟 ป้องกัน Badge ถูกบีบขาดครึ่ง */
    }

    /* ✨ dynamic glow ตามสถานะเครื่อง */
    .status-box-running {
      background: rgba(16, 185, 129, 0.12) !important;
      border-color: rgba(16, 185, 129, 0.5) !important;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.25) !important;
    }
    .status-box-running #current-status,
    .status-box-running .status-dot { color: #10b981;  }

    .status-box-setup {
      background: rgba(245, 158, 11, 0.12) !important;
      border-color: rgba(245, 158, 11, 0.5) !important;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25) !important;
    }
    .status-box-setup #current-status,
    .status-box-setup .status-dot { color: #f59e0b;  }

    .status-box-breakdown {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: rgba(239, 68, 68, 0.6) !important;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.35) !important;
      animation: alertPulse 1.5s infinite;
    }
    .status-box-breakdown #current-status,
    .status-box-breakdown .status-dot { color: #ef4444;  }

    @keyframes alertPulse {
      0%, 100% { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
      50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 35px rgba(239, 68, 68, 0.6); }
    }

    /* 📱 รองรับหน้าจอมือถือขนาดเล็กเป็นพิเศษ (< 380px) */
    @media (max-width: 380px) {
      .status-display-box {
        padding: 12px 12px;
      }
      .status-badge {
        font-size: 0.72rem;
        padding: 5px 10px;
      }
    }
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .btn-key { padding: 20px 8px; border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff; font-size: 1.6rem; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 8px 18px var(--shadow-color); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, filter 0.2s ease, border-color 0.2s ease; position: relative; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn-key::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%; background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 100%); pointer-events: none; }
    .key-subtext { font-size: 0.68rem; font-weight: 500; opacity: 0.95; margin-top: 4px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
    .key-1 { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .key-2 { background: linear-gradient(135deg, #2563eb, #3b82f6); }
    .key-3 { background: linear-gradient(135deg, #0891b2, #06b6d4); }
    .key-4, .key-5, .key-6 { background: linear-gradient(135deg, #059669, #10b981); }

    .btn-key:hover { transform: translateY(-5px) scale(1.03); border-color: rgba(255, 255, 255, 0.5); filter: brightness(1.12); }
    .key-1:hover { box-shadow: 0 14px 28px rgba(245, 158, 11, 0.45); }
    .key-2:hover { box-shadow: 0 14px 28px rgba(59, 130, 246, 0.45); }
    .key-3:hover { box-shadow: 0 14px 28px rgba(6, 182, 212, 0.45); }
    .key-4:hover, .key-5:hover, .key-6:hover { box-shadow: 0 14px 28px rgba(16, 185, 129, 0.45); }
    .btn-key:active { transform: translateY(2px) scale(0.94); filter: brightness(0.92); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4) !important; }

    .dice-container { background: var(--box-inner-bg); border: 1px dashed var(--border-color); border-radius: 20px; padding: 16px; text-align: center; margin-bottom: 20px; }
    .dice-box { font-size: 3.5rem; display: inline-block; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .dice-rolling { animation: spinDice 0.6s ease-in-out infinite; }
    @keyframes spinDice { 0% { transform: rotate(0deg) scale(0.8); } 50% { transform: rotate(180deg) scale(1.3); } 100% { transform: rotate(360deg) scale(0.8); } }
    .dice-result-badge { font-size: 0.88rem; font-weight: 700; color: var(--text-accent); margin: 6px 0 12px 0; min-height: 24px; }
    .btn-random { width: 100%; padding: 14px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #ffffff; border: none; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: 0 8px 18px rgba(124, 58, 237, 0.35); transition: all 0.2s ease; }
    .btn-random:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(124, 58, 237, 0.5); }
    .btn-reset-machine { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.12); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 14px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .btn-reset-machine:hover { background: #ef4444; color: white; }
  </style>
</head>
<body>

  <div class="mobile-card">
    <div class="top-bar">
      <a href="index.html" class="btn-nav">⬅️ กลับหน้าหลัก</a>
      <button class="btn-nav" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span>
        <span id="themeText">Light</span>
      </button>
    </div>

    <div class="header-info">
      <h2>⚙️ Machine 3 (M3)</h2>
      <p>กำลังผลิตสูงสุด: <b>160 ชิ้น/ชั่วโมง</b></p>
    </div>

    <div class="status-display-box" id="statusBox">
      <div>
        <div class="status-label">CURRENT MACHINE STATUS</div>
        <div class="status-value-wrapper">
          <span class="status-dot" id="statusDot"></span>
          <span id="current-status">STOP</span>
        </div>
      </div>
      <div>
        <span id="last-key-badge" class="status-badge">ปุ่มกด: -</span>
      </div>
    </div>

    <div class="keypad-grid">
      <button onclick="handleKey1Toggle()" class="btn-key key-1">
        1
        <span class="key-subtext">Setup / Breakdown</span>
      </button>
      <button onclick="handleKey(2, 'RUNNING', 60)" class="btn-key key-2">
        2
        <span class="key-subtext">ผลิต 60%</span>
      </button>
      <button onclick="handleKey(3, 'RUNNING', 70)" class="btn-key key-3">
        3
        <span class="key-subtext">ผลิต 70%</span>
      </button>
      <button onclick="handleKey(4, 'RUNNING', 80)" class="btn-key key-4">
        4
        <span class="key-subtext">ผลิต 80%</span>
      </button>
      <button onclick="handleKey(5, 'RUNNING', 80)" class="btn-key key-5">
        5
        <span class="key-subtext">ผลิต 80%</span>
      </button>
      <button onclick="handleKey(6, 'RUNNING', 80)" class="btn-key key-6">
        6
        <span class="key-subtext">ผลิต 80%</span>
      </button>
    </div>

    <div class="dice-container">
      <div id="diceIcon" class="dice-box">🎲</div>
      <div id="diceResultBadge" class="dice-result-badge">กดปุ่มสุ่มเพื่อหมุนลูกเต๋า</div>
      <button id="randomBtn" onclick="triggerRandomKeyWithDice()" class="btn-random">
        🎲 สุ่มกดตัวเลข (Random 1-6)
      </button>
    </div>

    <button onclick="resetMachineData()" class="btn-reset-machine">
      🗑️ รีเซ็ตข้อมูลเครื่อง M3
    </button>
  </div>

  <script type="module">
    import { db, ref, push, remove, onValue } from './js/firebase-config.js';

    const machineId = "M3";
    const idealCapacity = 160;
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbz_cfBGZbc64ECF3H77ZD1f95QF1RYkd2s5El5R55TKBScvtqz8hxJViwAY07cFpggK/exec"; 

    let currentMachineStatus = "STOP";
    let isRolling = false;
    const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    const machineLogRef = ref(db, `logs/${machineId}`);
    onValue(machineLogRef, (snapshot) => {
      const data = snapshot.val();
      const statusBox = document.getElementById('statusBox');
      const statusText = document.getElementById('current-status');
      const badgeText = document.getElementById('last-key-badge');

      statusBox.classList.remove('status-box-running', 'status-box-setup', 'status-box-breakdown');

      if (data) {
        const logsArray = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
        const latestLog = logsArray[logsArray.length - 1];
        if (latestLog) {
          currentMachineStatus = latestLog.eventType;
          badgeText.innerText = `ปุ่มกด: ${latestLog.keyPressed || '-'}`;

          if (latestLog.eventType === 'RUNNING') {
            statusBox.classList.add('status-box-running');
            statusText.innerText = `RUNNING (${latestLog.perfRate}%)`;
          } else if (latestLog.eventType === 'SETUP') {
            statusBox.classList.add('status-box-setup');
            statusText.innerText = 'SETUP';
          } else if (latestLog.eventType === 'BREAKDOWN') {
            statusBox.classList.add('status-box-breakdown');
            statusText.innerText = 'BREAKDOWN';
          }
        }
      } else {
        currentMachineStatus = "STOP";
        statusText.innerText = 'STOP';
        badgeText.innerText = 'ปุ่มกด: -';
      }
    });

    function sendToGoogleSheets(keyPressed, eventType, perfRate) {
      if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("https://script.google.com/macros/s/AKfycbyLWrK2U7U9m.../exec")) return;

      onValue(machineLogRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const logsArray = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
        
        let plannedHours = logsArray.length;
        let operatingHours = 0;
        let totalActualOutput = 0;
        let totalIdealTarget = 0;

        logsArray.forEach(log => {
          if (log.eventType === 'RUNNING') {
            operatingHours += 1;
            const loadPercent = (log.perfRate || 0) / 100;
            totalActualOutput += idealCapacity * loadPercent;
            totalIdealTarget += idealCapacity;
          }
        });

        const availability = plannedHours > 0 ? Number(((operatingHours / plannedHours) * 100).toFixed(1)) : 0;
        const latestLog = logsArray[logsArray.length - 1];
        let performance = 0;
        if (latestLog && latestLog.eventType === 'RUNNING') {
          performance = totalIdealTarget > 0 ? Number(((totalActualOutput / totalIdealTarget) * 100).toFixed(1)) : 0;
        }

        const quality = 100;
        const actualOutput = eventType === 'RUNNING' ? Math.round(idealCapacity * (perfRate / 100)) : 0;

        fetch(GOOGLE_SHEET_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            machineId: machineId,
            keyPressed: keyPressed,
            eventType: eventType,
            perfRate: perfRate,
            actualOutput: actualOutput,
            targetOutput: idealCapacity,
            availability: availability,
            performance: performance,
            quality: quality
          })
        }).catch(err => console.error("Sheet Sync Error:", err));
      }, { onlyOnce: true });
    }

    window.handleKey = function(keyNum, eventType, perfRate) {
      push(machineLogRef, {
        timestamp: Date.now(),
        keyPressed: keyNum,
        eventType: eventType,
        perfRate: perfRate
      });
      sendToGoogleSheets(keyNum, eventType, perfRate);
    };

    window.handleKey1Toggle = function() {
      let eventType;
      if (currentMachineStatus === 'SETUP' || currentMachineStatus === 'BREAKDOWN') {
        eventType = 'BREAKDOWN';
      } else {
        eventType = 'SETUP';
      }

      push(machineLogRef, {
        timestamp: Date.now(),
        keyPressed: 1,
        eventType: eventType,
        perfRate: 0
      });
      sendToGoogleSheets(1, eventType, 0);
    };

    window.triggerRandomKeyWithDice = function() {
      if (isRolling) return;
      isRolling = true;

      const diceEl = document.getElementById('diceIcon');
      const badgeEl = document.getElementById('diceResultBadge');
      const btn = document.getElementById('randomBtn');

      btn.disabled = true;
      btn.style.opacity = '0.6';
      diceEl.classList.add('dice-rolling');
      badgeEl.innerText = '🎲 กำลังหมุนสุ่มตัวเลข...';

      setTimeout(() => {
        const randomNum = Math.floor(Math.random() * 6) + 1;
        
        diceEl.classList.remove('dice-rolling');
        diceEl.innerText = diceFaces[randomNum - 1];
        
        diceEl.style.transform = 'scale(1.4)';
        setTimeout(() => { diceEl.style.transform = 'scale(1)'; }, 200);

        badgeEl.innerHTML = `✨ สุ่มได้เลข <b style="font-size: 1.2rem; color: var(--text-accent);">${randomNum}</b> !`;

        if (randomNum === 1) {
          handleKey1Toggle();
        } else if (randomNum === 2) {
          handleKey(2, 'RUNNING', 60);
        } else if (randomNum === 3) {
          handleKey(3, 'RUNNING', 70);
        } else {
          handleKey(randomNum, 'RUNNING', 80);
        }

        btn.disabled = false;
        btn.style.opacity = '1';
        isRolling = false;
      }, 800);
    };

    window.resetMachineData = function() {
      if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการรีเซ็ตข้อมูลของ ${machineId}?`)) {
        remove(machineLogRef)
          .then(() => {
            alert(`รีเซ็ตข้อมูลเครื่อง ${machineId} เรียบร้อยแล้ว!`);
            document.getElementById('diceIcon').innerText = '🎲';
            document.getElementById('diceResultBadge').innerText = 'กดปุ่มสุ่มเพื่อหมุนลูกเต๋า';
          })
          .catch((err) => alert('เกิดข้อผิดพลาด: ' + err.message));
      }
    };

    window.toggleTheme = function() {
      const htmlEl = document.documentElement;
      const currentTheme = htmlEl.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      htmlEl.setAttribute('data-theme', newTheme);
      localStorage.setItem('pu_theme', newTheme);
      updateThemeUI(newTheme);
    };

    function updateThemeUI(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.innerText = '☀️';
        text.innerText = 'Light';
      } else {
        icon.innerText = '🌙';
        text.innerText = 'Dark';
      }
    }

    const savedTheme = localStorage.getItem('pu_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeUI(savedTheme);
  </script>
</body>
</html>
